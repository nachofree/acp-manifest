openapi: 3.1.0
info:
  title: Hotel Authentication Service
  version: 1.0.0
  description: Authentication required to access hotel reservations via ChatGPT.

servers:
  - url: https://tackle-chips-fragrances-customers.trycloudflare.com/

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://tackle-chips-fragrances-customers.trycloudflare.com/auth/login-page
          tokenUrl: https://tackle-chips-fragrances-customers.trycloudflare.com/auth/callback-validate
          scopes: {}
  schemas: {}

security:
  - oauth2: []

paths:
  /auth/login-page:
    get:
      operationId: startLogin
      summary: Start browser-based login (browser only)
      responses:
        "200":
          description: Login page HTML
          content:
            text/html:
              schema:
                type: string

  /auth/callback-validate:
    post:
      operationId: completeOAuthLogin
      summary: Validate callback and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Login complete
          content:
            application/json:
              schema:
                type: object

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get identity of logged-in user
      responses:
        "200":
          description: Authenticated identity
