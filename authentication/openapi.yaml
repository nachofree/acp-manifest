openapi: 3.1.0
info:
  title: Hotel Authentication Service
  version: 1.0.0
  description: Authentication for hotel reservation access via ChatGPT.

servers:
  - url: https://tackle-chips-fragrances-customers.trycloudflare.com/

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://tackle-chips-fragrances-customers.trycloudflare.com/auth/login-page
          tokenUrl: https://tackle-chips-fragrances-customers.trycloudflare.com/auth/token-exchange
          scopes: {}

  schemas:
    OAuthCallbackResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
      required: [access_token, token_type]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

security:
  - oauth2: []

paths:

  /auth/login-page:
    get:
      operationId: startLogin
      summary: Start login in user's browser
      description: Browser opens for user to input email.
      responses:
        "200":
          description: Login page HTML content
          content:
            text/html:
              schema:
                type: string

  /auth/callback-validate:
    post:
      operationId: completeOAuthLogin
      summary: Validate login and issue tokens
      security: []   # GPT calls this anonymously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Login completed and tokens stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCallbackResponse"
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user
      security:
        - oauth2: []   # GPT MUST attach the token
      responses:
        "200":
          description: Authenticated identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  email:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
