openapi: 3.1.0
info:
  title: Hotel Authentication Service
  version: 1.0.0
  description: Sign-in required to access hotel reservations through ChatGPT.

servers:
  - url: https://tackle-chips-fragrances-customers.trycloudflare.com/

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://tackle-chips-fragrances-customers.trycloudflare.com/auth/login-page
          tokenUrl: https://tackle-chips-fragrances-customers.trycloudflare.com/auth/callback-validate
          scopes: {}

security:
  - oauth2: []

paths:
  /auth/login-page:
    get:
      operationId: startLogin
      summary: Start browser-based login (browser only)
      responses:
        "200":
          description: Login page HTML
          content:
            text/html:
              schema:
                type: string

  /auth/callback-validate:
    post:
      operationId: completeOAuthLogin
      summary: Validate callback code and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: OAuth login complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the identity of the logged-in user
      responses:
        "200":
          description: Authenticated identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  email:
                    type: string
        "401":
          description: Not authenticated
